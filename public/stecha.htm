<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moje vizitka — vCard</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #bbf7d0, #1e3a8a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 20px;
      max-width: 700px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      padding: 20px;
    }
    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      color: #334155;
    }
    .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .name { font-size: 28px; font-weight: bold; }
    .role { color: #555; margin-bottom: 16px; }
    .contact { margin: 6px 0; }
    .actions { margin-top: 20px; }
    .btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn.secondary { background: #0f172a; }
    @media(max-width: 600px){
      .card { grid-template-columns: 1fr; text-align: center; }
      .avatar { margin: 0 auto 20px auto; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">MST</div>
    <div class="info">
      <div class="name" id="displayName">Milan Štěcha</div>
      <div class="role" id="displayRole">elektroinstalace</div>
      <div class="contact" id="displayPhone">📞 +420 775 338 093</div>
      <div class="contact" id="displayEmail">📧 milan.stecha@outlook.com</div>
      <div class="contact" id="displayWeb">🌐 okelectric.cz</div>
      <div class="contact" id="displayAddress">🏢 Písek</div>

      <div class="actions">
        <a class="btn" id="downloadLink" download>📥 Přidat kontakt (.vcf)</a>
      </div>
    </div>
  </div>

<script>
  const CONTACT = {
    firstName: "Milan",
    lastName: "Štěcha",
    fullName: "Milan Štěcha",
    org: "OKelectric",
    title: "elektroinstalace",
    phone: "+420775338093",
    email: "milan.stecha@outlook.com",
    url: "https://www.okelectric.cz",
    street: "",
    city: "",
    postal: "39701",
    country: "Česko"
  };

  function escapeVCard(text) {
    return String(text ?? "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  }

  function buildVCard(c) {
    const EOL = "\r\n";
    const n = `${escapeVCard(c.lastName)};${escapeVCard(c.firstName)};;;`;
    const fn = escapeVCard(c.fullName || `${c.firstName} ${c.lastName}`);
    const org = escapeVCard(c.org);
    const title = escapeVCard(c.title);
    const tel = escapeVCard(c.phone);
    const email = escapeVCard(c.email);
    const url = escapeVCard(c.url);
    const adr = `;;${escapeVCard(c.street)};${escapeVCard(c.city)};;${escapeVCard(c.postal)};${escapeVCard(c.country)}`;

    return [
      'BEGIN:VCARD',
      'VERSION:3.0',
      `N:${n}`,
      `FN:${fn}`,
      org ? `ORG:${org}` : null,
      title ? `TITLE:${title}` : null,
      tel ? `TEL;TYPE=CELL,VOICE:${tel}` : null,
      email ? `EMAIL;TYPE=INTERNET:${email}` : null,
      url ? `URL:${url}` : null,
      `ADR;TYPE=WORK:${adr}`,
      'END:VCARD'
    ].filter(Boolean).join(EOL) + EOL;
  }

  function createVcfBlobAndLink() {
    const vcf = buildVCard(CONTACT);
    const blob = new Blob([vcf], { type: 'text/x-vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.getElementById('downloadLink');
    const filename = `${(CONTACT.fullName || (CONTACT.firstName + ' ' + CONTACT.lastName)).replace(/\s+/g,'_')}.vcf`;
    a.href = url;
    a.download = filename;
  }

  createVcfBlobAndLink();
</script>
</body>
</html>
